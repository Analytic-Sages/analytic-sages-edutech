[project]
name = "analyticsages-backend"
version = "0.1.0"
description = "Analytic Sages API — authentication and platform services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "pydantic[email]>=2.10.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.10.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
